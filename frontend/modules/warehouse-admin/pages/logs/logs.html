<div class="logs-page-container">
  <!-- Page Header -->
  <div class="dashboard-header flex justify-between align-center mb-lg" style="flex-wrap: wrap; gap: var(--spacing-md);">
    <div>
      <h2 class="m-0 page-title">
        Platform Operations &amp; Logs Auditor
      </h2>
      <p class="m-0 page-subtitle">
        Monitor Kubernetes pod pools, distributed cache status, and double-entry platform audit transactions
      </p>
    </div>
    <div style="display:flex; align-items:center; gap: var(--spacing-md);">
      <div class="status-pill">
        <span class="status-dot"></span>
        AIOps Stable
      </div>
      <button id="btn-header-pull-data" class="btn btn-gold-gradient" type="button">
        <i data-lucide="refresh-cw" class="icon-sm"></i> Pull Data
      </button>
    </div>
  </div>

  <!-- Interactive Tabbed Log Viewer -->
  <div class="card glass flex flex-col viewer-card">
    <div class="flex justify-between align-center mb-md flex-wrap gap-sm">
      <!-- Tabs Controls -->
      <div class="tabs-container flex gap-xs">
        <button id="tab-login-logs" class="btn tab-btn active">
          User Login Activity
        </button>
        <button id="tab-audit-logs" class="btn tab-btn">
          Audit Logs
        </button>
        <button id="tab-system-logs" class="btn tab-btn">
          System Diagnostics
        </button>
      </div>

      <!-- Filters & Action Bar -->
      <div class="flex align-center gap-xs flex-wrap controls-bar">
        <!-- Admin User Selector Dropdown -->
        <div id="admin-user-selector-container" class="filter-group" style="display: none;">
          <span class="filter-label">Select User:</span>
          <select id="select-log-user" class="log-select-input">
            <option value="">Loading users...</option>
          </select>
        </div>

        <div class="filter-group">
          <span class="filter-label">From:</span>
          <input type="date" id="log-start-date" class="log-date-input" />
        </div>
        <div class="filter-group">
          <span class="filter-label">To:</span>
          <input type="date" id="log-end-date" class="log-date-input" />
        </div>

        <button id="btn-pull-user-data" class="btn btn-accent-pull" type="button">
          <i data-lucide="download-cloud" class="icon-xs"></i> Pull User Data
        </button>
        <button id="btn-reset-logs" class="btn btn-reset" type="button">
          Reset
        </button>
        <button id="btn-export-pdf" class="btn btn-export-pdf" type="button">
          <i data-lucide="file-text" class="icon-xs"></i> Export PDF
        </button>
      </div>
    </div>
    
    <div class="table-wrapper">
      <table class="w-100 log-data-table">
        <thead id="log-table-head"></thead>
        <tbody id="log-table-body"></tbody>
      </table>
    </div>
  </div>
</div>
